<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - YMCA Uganda Student Management</title>
    <meta name="description" content="YMCA Uganda Admin Dashboard">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/database/indexeddb.js"></script>
    <script src="js/database/studentsRepository.js"></script>
    <script src="js/database/programsRepository.js"></script>
    <script src="js/database/departmentsRepository.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="admin-page">
    <div class="admin-wrapper">
        <main class="admin-content">
            <div class="welcome-banner">
                <h1 id="welcome-message">Good morning, Administrator</h1>
                <p>Here's what's happening with YMCA Uganda today.</p>
            </div>

            <div class="stats-grid" id="dashboard-stats">
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-user-graduate"></i></div><div class="stat-info"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Total Students</span></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-user-plus"></i></div><div class="stat-info"><span class="stat-value" id="stat-new">0</span><span class="stat-label">New Registrations</span></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div class="stat-info"><span class="stat-value" id="stat-active">0</span><span class="stat-label">Active Students</span></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-graduation-cap"></i></div><div class="stat-info"><span class="stat-value" id="stat-completed">0</span><span class="stat-label">Completed Students</span></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-book"></i></div><div class="stat-info"><span class="stat-value" id="stat-programs">0</span><span class="stat-label">Available Programs</span></div></div>
            </div>

            <div class="dashboard-charts">
                <div class="chart-card">
                    <h3><i class="fas fa-chart-line"></i> Registration Trends</h3>
                    <div class="chart-container"><canvas id="chart-registration"></canvas></div>
                </div>
                <div class="charts-row">
                    <div class="chart-card"><h3><i class="fas fa-pie-chart"></i> Students by Program</h3><div class="chart-container"><canvas id="chart-program"></canvas></div></div>
                    <div class="chart-card"><h3><i class="fas fa-venus-mars"></i> Students by Gender</h3><div class="chart-container"><canvas id="chart-gender"></canvas></div></div>
                    <div class="chart-card"><h3><i class="fas fa-chart-pie"></i> Students by Status</h3><div class="chart-container"><canvas id="chart-status"></canvas></div></div>
                </div>
            </div>

            <div class="recent-section">
                <h3><i class="fas fa-history"></i> Recent Registrations</h3>
                <div id="recent-registrations"></div>
            </div>
        </main>
    </div>
</body>
</html>
