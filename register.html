<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - YMCA Uganda</title>
    <meta name="description" content="YMCA Uganda Student Registration Form">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/database/indexeddb.js"></script>
    <script src="js/database/studentsRepository.js"></script>
    <script src="js/database/programsRepository.js"></script>
    <script src="js/database/departmentsRepository.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/app.js"></script>
    <script src="js/register.js"></script>
</head>
<body class="register-page">
    <div class="register-header">
        <div class="container header-inner">
            <div class="logo"><img src="assets/images/ymca-logo.jpg" alt="YMCA Uganda"><span>YMCA Uganda</span></div>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <div class="container register-container">
        <div class="register-card" id="registration-form">
            <div class="wizard-header">
                <h2 class="wizard-title">Student Registration</h2>
                <div class="reg-number">Registration Number: <span id="reg-number-display">-</span></div>
            </div>

            <div class="step-progress">
                <div class="step-bar"><div class="step-fill" id="step-fill"></div></div>
                <div class="step-dots" id="step-dots">
                    <button type="button" class="step-dot" data-step="1">Personal Info</button>
                    <button type="button" class="step-dot" data-step="2">Contact</button>
                    <button type="button" class="step-dot" data-step="3">Academic</button>
                    <button type="button" class="step-dot" data-step="4">Additional</button>
                    <button type="button" class="step-dot" data-step="5">Review</button>
                </div>
            </div>

            <div class="wizard-body">
                <!-- Step 1: Personal Information -->
                <div class="step-pane active" id="step-1">
                    <h3 class="step-title">Personal Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="middleName">Middle Name</label>
                            <input type="text" id="middleName" name="middleName">
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender *</label>
                            <select id="gender" name="gender" required></select>
                        </div>
                        <div class="form-group">
                            <label for="dateOfBirth">Date of Birth *</label>
                            <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                        </div>
                        <div class="form-group">
                            <label for="nationality">Nationality *</label>
                            <select id="nationality" name="nationality" required></select>
                        </div>
                        <div class="form-group">
                            <label for="nationalId">National ID Number *</label>
                            <input type="text" id="nationalId" name="nationalId" required>
                        </div>
                        <div class="form-group">
                            <label for="maritalStatus">Marital Status *</label>
                            <select id="maritalStatus" name="maritalStatus" required></select>
                        </div>
                    </div>
                    <div class="form-group photo-upload">
                        <label for="photo">Profile Photo</label>
                        <div class="photo-upload-area">
                            <input type="file" id="photo" name="photo" accept="image/*" style="display:none">
                            <div class="photo-preview" id="photo-preview"><i class="fas fa-user-circle"></i></div>
                                                        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('photo').click()">Upload Photo</button>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Contact Information -->
                <div class="step-pane" id="step-2">
                    <h3 class="step-title">Contact Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required placeholder="+256 XXX XXX XXX">
                        </div>
                        <div class="form-group">
                            <label for="alternativePhone">Alternative Phone</label>
                            <input type="tel" id="alternativePhone" name="alternativePhone" placeholder="+256 XXX XXX XXX">
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="student@example.com">
                        </div>
                        <div class="form-group">
                            <label for="district">District *</label>
                            <select id="district" name="district" required></select>
                        </div>
                        <div class="form-group">
                            <label for="city">City/Town</label>
                            <input type="text" id="city" name="city">
                        </div>
                        <div class="form-group">
                            <label for="village">Village</label>
                            <input type="text" id="village" name="village">
                        </div>
                        <div class="form-group full-width">
                            <label for="address">Physical Address</label>
                            <input type="text" id="address" name="address" placeholder="Street, building, landmark">
                        </div>
                        <div class="form-group">
                            <label for="emergencyContact">Emergency Contact Name *</label>
                            <input type="text" id="emergencyContact" name="emergencyContact" required>
                        </div>
                        <div class="form-group">
                            <label for="emergencyPhone">Emergency Phone *</label>
                            <input type="tel" id="emergencyPhone" name="emergencyPhone" required placeholder="+256 XXX XXX XXX">
                        </div>
                        <div class="form-group">
                            <label for="relationship">Relationship</label>
                            <input type="text" id="relationship" name="relationship" placeholder="e.g. Parent, Guardian, Spouse">
                        </div>
                    </div>
                </div>

                <!-- Step 3: Academic Information -->
                <div class="step-pane" id="step-3">
                    <h3 class="step-title">Academic Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="previousSchool">Previous School</label>
                            <input type="text" id="previousSchool" name="previousSchool" placeholder="Last school attended">
                        </div>
                        <div class="form-group">
                            <label for="educationLevel">Highest Level of Education</label>
                            <select id="educationLevel" name="educationLevel">
                                <option value="">Select</option>
                                <option value="O-Level">O-Level</option>
                                <option value="A-Level">A-Level</option>
                                <option value="Diploma">Diploma</option>
                                <option value="Bachelor's">Bachelor's</option>
                                <option value="Master's">Master's</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="program">Course/Program *</label>
                            <select id="program" name="program" required></select>
                        </div>
                        <div class="form-group">
                            <label for="department">Department *</label>
                            <select id="department" name="department" required></select>
                        </div>
                        <div class="form-group">
                            <label for="intake">Intake *</label>
                            <select id="intake" name="intake" required></select>
                        </div>
                        <div class="form-group">
                            <label for="studyMode">Study Mode *</label>
                            <select id="studyMode" name="studyMode" required></select>
                        </div>
                        <div class="form-group">
                            <label for="yearOfStudy">Year of Study *</label>
                            <select id="yearOfStudy" name="yearOfStudy" required></select>
                        </div>
                        <div class="form-group">
                            <label for="academicSession">Academic Session *</label>
                                                        <select id="academicSession" name="academicSession" required></select>
                        </div>
                    </div>
                </div>

                <!-- Step 4: Additional Information -->
                <div class="step-pane" id="step-4">
                    <h3 class="step-title">Additional Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="disability">Disability Status *</label>
                            <select id="disability" name="disability" required></select>
                        </div>
                        <div class="form-group">
                            <label for="specialNeeds">Special Needs</label>
                            <input type="text" id="specialNeeds" name="specialNeeds" placeholder="Describe any special needs">
                        </div>
                        <div class="form-group">
                            <label for="sponsor">Sponsor</label>
                            <input type="text" id="sponsor" name="sponsor" placeholder="e.g. Parent, Government, NGO, Self">
                        </div>
                        <div class="form-group">
                            <label for="guardian">Parent/Guardian Name *</label>
                            <input type="text" id="guardian" name="guardian" required>
                        </div>
                        <div class="form-group">
                            <label for="guardianPhone">Parent/Guardian Phone *</label>
                            <input type="tel" id="guardianPhone" name="guardianPhone" required placeholder="+256 XXX XXX XXX">
                        </div>
                        <div class="form-group">
                            <label for="referralSource">How did you hear about YMCA? *</label>
                            <input type="text" id="referralSource" name="referralSource" required placeholder="e.g. Friend, Online, Advertisement, Community">
                        </div>
                    </div>
                </div>

                <!-- Step 5: Review & Submit -->
                <div class="step-pane" id="step-5">
                    <h3 class="step-title">Review & Submit</h3>
                    <div class="review-content" id="review-content">
                        <div class="text-center"><p>Loading review...</p></div>
                    </div>
                </div>
            </div>

            <div class="wizard-footer">
                <button type="button" class="btn btn-secondary" id="btn-prev"><i class="fas fa-arrow-left"></i> Previous</button>
                <button type="button" class="btn btn-primary" id="btn-next">Next Step <i class="fas fa-arrow-right"></i></button>
                <button type="button" class="btn btn-success" id="btn-submit" style="display:none;"><i class="fas fa-check"></i> Submit Registration</button>
            </div>
        </div>
    </div>
</body>
</html>
