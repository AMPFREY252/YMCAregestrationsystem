<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful - YMCA Uganda</title>
    <meta name="description" content="YMCA Uganda Student Registration Success">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/database/indexeddb.js"></script>
    <script src="js/database/studentsRepository.js"></script>
    <script src="js/database/programsRepository.js"></script>
    <script src="js/database/departmentsRepository.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const reg = params.get('reg') || 'YMCA-2026-XXXX';
            const id = params.get('id') || '';
            document.getElementById('reg-number').textContent = reg;
            document.getElementById('student-id').textContent = id;
        });
    </script>
</head>
<body class="success-page">
    <div class="container success-container">
        <div class="success-card">
            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
            <h1>Registration Successful!</h1>
            <p class="success-message">Your application has been submitted successfully. Please save the following information for future reference.</p>
            <div class="success-details">
                <div class="detail-item"><span class="detail-label">Registration Number</span><span class="detail-value" id="reg-number">-</span></div>
            </div>
            <div class="success-actions">
                <a href="register.html" class="btn btn-primary"><i class="fas fa-user-plus"></i> Register Another Student</a>
                <a href="login.html" class="btn btn-outline"><i class="fas fa-sign-in-alt"></i> Staff Login</a>
            </div>
            <div class="success-note"><small>You can view and manage this registration by logging in as a staff member.</small></div>
        </div>
    </div>
</body>
</html>
