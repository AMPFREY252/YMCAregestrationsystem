<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - YMCA Uganda Student Management</title>
    <meta name="description" content="YMCA Uganda Reports">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/print.css">
    <script src="js/database/indexeddb.js"></script>
    <script src="js/database/studentsRepository.js"></script>
    <script src="js/database/programsRepository.js"></script>
    <script src="js/database/departmentsRepository.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</head>
<body class="admin-page">
    <div class="admin-wrapper">
        <main class="admin-content" id="printable-area">
            <div class="page-header">
                <h1><i class="fas fa-chart-bar"></i> Reports</h1>
                <div class="report-meta">
                    <span class="meta-item">Report Date: <span id="report-date"></span></span>
                    <span class="meta-item">Total Records: <span id="report-count">0</span></span>
                </div>
            </div>
            <div class="toolbar">
                <div class="filter-group">
                    <input type="date" id="date-from" class="date-input">
                    <input type="date" id="date-to" class="date-input">
                    <select id="filter-status"><option value="">All Statuses</option><option value="active">Active</option><option value="pending">Pending</option><option value="completed">Completed</option><option value="suspended">Suspended</option></select>
                    <select id="filter-program"><option value="">All Programs</option></select>
                    <button class="btn btn-primary btn-sm" id="filter-btn">Generate Report</button>
                </div>
                <div class="report-actions">
                    <button class="btn btn-outline btn-sm" id="print-report"><i class="fas fa-print"></i> Print</button>
                    <button class="btn btn-outline btn-sm" id="export-csv"><i class="fas fa-file-csv"></i> Export CSV</button>
                    <button class="btn btn-outline btn-sm" id="export-json"><i class="fas fa-file-export"></i> Export JSON</button>
                </div>
            </div>
            <div id="report-table"></div>
            <div class="report-footer">
                <p>YMCA Uganda - Student Registration & Management System | Confidential Report</p>
            </div>
        </main>
    </div>
</body>
</html>
