<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - YMCA Uganda Student Management System</title>
    <meta name="description" content="YMCA Uganda Staff Login">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/database/indexeddb.js"></script>
    <script src="js/database/usersRepository.js"></script>
    <script src="js/database/studentsRepository.js"></script>
    <script src="js/database/programsRepository.js"></script>
    <script src="js/database/departmentsRepository.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo"><img src="assets/images/ymca-logo.jpg" alt="YMCA Uganda"></div>
                <h2>YMCA Uganda</h2>
                <p class="login-subtitle">Staff Administration Portal</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-icon"><input type="text" id="username" name="username" autocomplete="username" required><i class="fas fa-user"></i></div>
                    <span class="form-error" id="error-username"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button type="button" id="toggle-password" class="password-toggle" aria-label="Show/hide password"><i class="fas fa-eye"></i></button>
                    </div>
                    <span class="form-error" id="error-password"></span>
                </div>
                <div class="form-row">
                    <div class="form-check"><input type="checkbox" id="remember" checked><label for="remember">Remember session</label></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
            <div class="login-footer">
                <div class="demo-creds"><small>Demo accounts: admin/admin123 | registration/reg123 | viewer/view123</small></div>
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Public Site</a>
            </div>
        </div>
    </div>
    <div class="login-bg-decoration">
        <div class="deco-circle deco-1"></div>
        <div class="deco-circle deco-2"></div>
        <div class="deco-circle deco-3"></div>
    </div>
</body>
</html>
