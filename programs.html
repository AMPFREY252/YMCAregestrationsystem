<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs - YMCA Uganda Student Management</title>
    <meta name="description" content="YMCA Uganda Program Management">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/database/indexeddb.js"></script>
    <script src="js/database/studentsRepository.js"></script>
    <script src="js/database/programsRepository.js"></script>
    <script src="js/database/departmentsRepository.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/programs.js"></script>
</head>
<body class="admin-page">
    <div class="admin-wrapper">
        <main class="admin-content">
            <div class="page-header">
                <h1><i class="fas fa-book"></i> Programs</h1>
                <button class="btn btn-primary" id="btn-add-program"><i class="fas fa-plus"></i> Add Program</button>
            </div>
            <div class="toolbar">
                <input type="text" id="search-input" class="search-input" placeholder="Search programs...">
                <select id="filter-status" class="filter-select"><option value="">All Statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
            </div>
            <div id="programs-table"></div>
            <div id="pagination-container"></div>
        </main>
    </div>
</body>
</html>
